
name: Build Android APK (teste_som)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Accept Android SDK Licenses & Build APK
      env:
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        # Aceita licencas do SDK pre-instalado no container
        yes | sdkmanager --licenses || true
        
        # Executa o buildozer sem solicitar confirmacoes interativas
        yes | buildozer -v android debug
        
        # Garante um nome fixo e limpo para o APK
        mv bin/*.apk bin/teste_som.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: teste_som.apk
        path: bin/teste_som.apk
