name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev wget

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Setup Android SDK and Command Line Tools
      run: |
        # 1. Cria a estrutura exata de diretorios para o Android SDK no Buildozer
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        
        # 2. Baixa as ferramentas de linha de comando oficiais do Android SDK
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
        unzip -q cmdline.zip
        
        # 3. Copia os binarios para a pasta que o Buildozer procura
        cp -r cmdline-tools/bin/* ~/.buildozer/android/platform/android-sdk/tools/bin/
        cp -r cmdline-tools/lib ~/.buildozer/android/platform/android-sdk/tools/
        rm -rf cmdline.zip cmdline-tools

        # 4. Injeta os arquivos de licenca aceitos diretamente no SDK
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n24545115b802feb56b13421001c1f2e0a717c630" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9402116df57d54477061225967747380a7" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK
      env:
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_LATEST_HOME: ""
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: teste_som
        path: bin/*.apk
