name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev gettext zlib1g-dev zip unzip
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Install Build-Tools 33 and Pre-accept Licenses
      run: |
        # 1. Instala explicitamente a versao 33.0.2 das build-tools e aceita todas as licencas
        yes | sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true
        yes | sdkmanager --licenses || true

        # 2. Prepara e injeta as chaves de licencas na pasta do Buildozer
        BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$BUILDOZER_SDK/licenses"
        mkdir -p "$ANDROID_SDK_ROOT/licenses"

        cp -r $ANDROID_SDK_ROOT/licenses/* "$BUILDOZER_SDK/licenses/" 2>/dev/null || true

        # 3. Garante o link do sdkmanager antigo para o novo em ambos os caminhos
        mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
        mkdir -p "$BUILDOZER_SDK/tools/bin"
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "$BUILDOZER_SDK/tools/bin/sdkmanager"

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: teste_som
        path: bin/*.apk
