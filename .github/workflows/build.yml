name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer

    steps:
    - uses: actions/checkout@v4

    - name: Build APK
      run: |
        yes | buildozer --warn_on_root=0 android debug

    - name: Rename APK
      run: |
        mv bin/*.apk bin/teste_som.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: teste_som
        path: bin/teste_som.apk
