name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Pre-accept Buildozer SDK Licenses
      run: |
        # Cria a pasta de licencas no caminho exato que o Buildozer utiliza
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        
        # Injeta as assinaturas oficiais de licencas do Google
        echo -e "\n24545115b802feb56b13421001c1f2e0a717c630" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9402116df57d54477061225967747380a7" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo -e "\nd93889345840035e406bc7306492d9f8bf1e0b52" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
        echo -e "\n33b622e74620501b98282034570b96da0e989f7f" > ~/.buildozer/android/platform/android-sdk/licenses/mips-android-sysimage-license

    - name: Build APK
      env:
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_LATEST_HOME: ""
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: teste_som
        path: bin/*.apk
