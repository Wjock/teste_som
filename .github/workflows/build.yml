name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Build APK
      env:
        ACCEPT_SDK_LICENSES: "1"
        BUILDOZER_ACCEPT_LICENSES: "1"
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_LATEST_HOME: ""
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: teste_som
        path: bin/*.apk
